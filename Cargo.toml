[package]
name = "steelmouse"
version = "2.5.1"
edition = "2021"
authors = ["SteelMouse Contributors"]
description = "Native SteelSeries mouse battery system tray monitor"

[dependencies]
hidapi = "2.6"
tray-icon = "0.19"
muda = "0.15"
tao = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
eframe = "0.31"
egui = "0.31"
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = "0.2"
objc2-foundation = "0.2"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

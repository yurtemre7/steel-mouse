name: Build SteelMouse (Rust)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust-windows:
    name: Build Rust Native Windows App & Installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run Unit Tests
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: powershell

      - name: Compile Rust Inno Setup script
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'innosetup\setup_rust.iss'
        shell: powershell

      - name: Stage Rust Windows Installer & Standalone Zip Artifacts
        run: |
          mkdir staging
          copy innosetup\SteelMouse_Rust_Setup.exe staging\SteelMouse_Rust_Setup.exe
          Compress-Archive -Path target\x86_64-pc-windows-msvc\release\steelmouse.exe -DestinationPath staging\steelmouse-windows-x64.zip
        shell: powershell

      - name: Upload Rust Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SteelMouse-Rust-Windows
          path: staging/*

  build-rust-macos:
    name: Build Rust Native macOS Binaries
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run Unit Tests
        run: cargo test

      - name: Build macOS Apple Silicon Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build macOS Intel Binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Stage macOS Binaries
        run: |
          mkdir -p staging
          cp target/aarch64-apple-darwin/release/steelmouse staging/steelmouse-macos-arm64
          cp target/x86_64-apple-darwin/release/steelmouse staging/steelmouse-macos-x64

      - name: Upload macOS Separate Binaries
        uses: actions/upload-artifact@v7
        with:
          name: SteelMouse-Rust-macOS
          path: staging/*

  release:
    name: Publish Release Artifacts
    needs: [build-rust-windows, build-rust-macos]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Tag Name from Cargo.toml, Commit Message or Ref
        id: release_tag
        run: |
          CARGO_VER="v$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            RAW_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$RAW_MSG" | sed -n 's/^release:\s*//p' | head -n1 | tr -d ' ')
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="$CARGO_VER"
            fi
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG_NAME"

      - name: Generate Release Notes & Changelog
        run: python scripts/generate_changelog.py

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
